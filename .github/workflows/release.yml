name: Release

on:
  workflow_dispatch:
    # No inputs needed - use the branch/tag selector in GitHub UI

permissions:
  contents: write  # Required to create releases and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Verify ref is a tag
        run: |
          # Check if the selected ref is actually a tag
          if ! git describe --exact-match --tags HEAD 2>/dev/null; then
            echo "❌ Error: You must select a tag, not a branch!"
            echo "Current ref: ${{ github.ref_name }}"
            echo ""
            echo "Usage:"
            echo "1. Go to Actions → Release workflow"
            echo "2. Click 'Run workflow'"
            echo "3. In 'Use workflow from' dropdown, select a TAG (e.g., v0.2.0)"
            echo "4. Click 'Run workflow'"
            exit 1
          fi
          echo "✅ Verified: Running release for tag ${{ github.ref_name }}"

      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libapt-pkg-dev \
            libgpgme-dev \
            libgpg-error-dev \
            libssl-dev \
            debhelper \
            devscripts \
            dh-cargo

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/index
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Run build script
        run: ./build-package.sh

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Verify artifacts exist
        run: |
          ls -lh release/v${{ steps.version.outputs.version }}/
          echo ""
          echo "Checksums:"
          cat release/v${{ steps.version.outputs.version }}/SHA256SUMS.txt

      - name: Get tag annotation (changelog)
        id: tag_annotation
        run: |
          # Get the tag annotation message (contains changelog)
          TAG_NAME="${{ github.ref_name }}"
          ANNOTATION=$(git tag -l --format='%(contents)' "$TAG_NAME")
          
          # Save to file for multiline handling
          echo "$ANNOTATION" > /tmp/tag_message.txt
          
          # Set output (GitHub Actions handles multiline)
          {
            echo 'message<<EOF'
            cat /tmp/tag_message.txt
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.tag_annotation.outputs.message }}
          draft: false
          prerelease: false
          files: |
            release/v${{ steps.version.outputs.version }}/*.deb
            release/v${{ steps.version.outputs.version }}/rust-add-apt-repository-v*-x86_64-linux
            release/v${{ steps.version.outputs.version }}/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release complete
        run: |
          echo "✅ Release ${{ github.ref_name }} created successfully!"
          echo "📦 Artifacts uploaded:"
          echo "  - rust-add-apt-repository_${{ steps.version.outputs.version }}-1_amd64.deb"
          echo "  - rust-add-apt-repository-v${{ steps.version.outputs.version }}-x86_64-linux"
          echo "  - SHA256SUMS.txt"
