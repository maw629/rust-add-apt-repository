name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.2.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pre-check: Ensure CI passed on this tag
  verify-ci:
    name: Verify CI Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Get commit SHA
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Check CI status
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.commit.outputs.sha }}';
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });
            
            const ciCheck = checks.check_runs.find(check => check.name.includes('CI'));
            
            if (!ciCheck) {
              core.setFailed('No CI check found for this commit');
              return;
            }
            
            if (ciCheck.conclusion !== 'success') {
              core.setFailed(`CI check status: ${ciCheck.conclusion}. Only release from commits with passing CI.`);
              return;
            }
            
            core.info('✅ CI passed for this commit');

  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: verify-ci
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libapt-pkg-dev \
            libgpgme-dev \
            libgpg-error-dev \
            libssl-dev \
            debhelper \
            devscripts \
            dh-cargo

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/index
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Run build script
        run: ./build-package.sh

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Verify artifacts exist
        run: |
          ls -lh release/v${{ steps.version.outputs.version }}/
          echo ""
          echo "Checksums:"
          cat release/v${{ steps.version.outputs.version }}/SHA256SUMS.txt

      - name: Get tag annotation (changelog)
        id: tag_annotation
        run: |
          # Get the tag annotation message (contains changelog)
          git fetch --tags
          ANNOTATION=$(git tag -l --format='%(contents)' ${{ inputs.tag }})
          
          # Save to file for multiline handling
          echo "$ANNOTATION" > /tmp/tag_message.txt
          
          # Set output (GitHub Actions handles multiline)
          {
            echo 'message<<EOF'
            cat /tmp/tag_message.txt
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          body: ${{ steps.tag_annotation.outputs.message }}
          draft: false
          prerelease: false
          files: |
            release/v${{ steps.version.outputs.version }}/*.deb
            release/v${{ steps.version.outputs.version }}/rust-add-apt-repository-v*-x86_64-linux
            release/v${{ steps.version.outputs.version }}/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release complete
        run: |
          echo "✅ Release ${{ inputs.tag }} created successfully!"
          echo "📦 Artifacts uploaded:"
          echo "  - rust-add-apt-repository_${{ steps.version.outputs.version }}-1_amd64.deb"
          echo "  - rust-add-apt-repository-v${{ steps.version.outputs.version }}-x86_64-linux"
          echo "  - SHA256SUMS.txt"
