name: E2E Tests

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e-test:
    name: End-to-End Tests on ${{ matrix.ubuntu }}
    runs-on: ${{ matrix.ubuntu }}
    
    strategy:
      fail-fast: false
      matrix:
        ubuntu: [ubuntu-22.04, ubuntu-24.04]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper pkg-config \
            libapt-pkg-dev libgpgme-dev libgpg-error-dev libssl-dev

      - name: Build Debian package
        run: |
          echo "=== Building .deb package with debuild ==="
          # debuild runs: cargo clean, cargo build --release, cargo test, and packages
          debuild -us -uc -b
          
          echo "=== Package built ==="
          ls -lh ../*.deb
          
          # Move package to current directory for easier access
          mv ../*.deb ./rust-add-apt-repository.deb
          ls -lh rust-add-apt-repository.deb

      - name: Install Debian package
        run: |
          echo "=== Installing rust-add-apt-repository from .deb ==="
          sudo dpkg -i rust-add-apt-repository.deb
          
          echo "=== Verifying installation via dpkg ==="
          dpkg -l | grep rust-add-apt-repository
          echo ""
          echo "=== Installed files ==="
          dpkg -L rust-add-apt-repository

      - name: Verify installation
        run: |
          echo "=== Verifying installed binary ==="
          which rust-add-apt-repository
          rust-add-apt-repository --version
          rust-add-apt-repository --help

      # Test 1: Record initial state (always succeeds, for baseline)
      - name: Test 1 - Record initial state
        run: |
          echo "=== Recording Initial APT State ==="
          INITIAL_COUNT=$(find /etc/apt/sources.list.d/ -name "*.list" -type f | wc -l)
          echo "Initial .list files: $INITIAL_COUNT"
          echo "INITIAL_COUNT=$INITIAL_COUNT" >> $GITHUB_ENV
          
          # Record if Git PPA already exists (for idempotency)
          if ls /etc/apt/sources.list.d/git-core-ubuntu-ppa-*.list 2>/dev/null; then
            echo "GIT_PPA_PRE_EXISTS=true" >> $GITHUB_ENV
            echo "⚠️ Git PPA already exists (workflow not starting clean)"
          else
            echo "GIT_PPA_PRE_EXISTS=false" >> $GITHUB_ENV
            echo "✅ Git PPA not present (clean state)"
          fi

      # Test 2: Verify --list functionality
      # SUCCESS: Command exits 0 and outputs repository lines
      - name: Test 2 - List repositories
        run: |
          echo "=== Test: List repositories ==="
          OUTPUT=$(sudo rust-add-apt-repository --list 2>&1)
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ FAIL: --list command failed with exit code $EXIT_CODE"
            echo "$OUTPUT"
            exit 1
          fi
          
          # Should output at least one repository line
          LINE_COUNT=$(echo "$OUTPUT" | wc -l)
          if [ $LINE_COUNT -lt 1 ]; then
            echo "❌ FAIL: --list produced no output"
            exit 1
          fi
          
          echo "✅ PASS: Listed $LINE_COUNT repository lines"
          echo "$OUTPUT" | head -10

      # Test 3: Test dry-run mode (should NOT modify system)
      # SUCCESS: Exit 0, file NOT created, no state changes
      - name: Test 3 - Dry-run mode
        run: |
          echo "=== Test: Dry-run mode ==="
          
          # Run dry-run add
          rust-add-apt-repository ppa:deadsnakes/ppa --dry-run
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ FAIL: Dry-run command failed (exit $EXIT_CODE)"
            exit 1
          fi
          
          # Verify file was NOT created
          if ls /etc/apt/sources.list.d/deadsnakes-ubuntu-ppa-*.list 2>/dev/null; then
            echo "❌ FAIL: Dry-run created repository file (should not happen)"
            exit 1
          fi
          
          echo "✅ PASS: Dry-run did not modify system"

      # Test 4: Add PPA (idempotent - skip if already exists)
      # SUCCESS: File exists after operation, exit code 0 or already-exists
      - name: Test 4 - Add Git PPA
        id: add_ppa
        run: |
          echo "=== Test: Add ppa:git-core/ppa ==="
          
          # Skip if already exists (idempotency)
          if [ "$GIT_PPA_PRE_EXISTS" = "true" ]; then
            echo "⏭️ SKIP: Git PPA already exists, skipping add test"
            echo "PPA_ADDED=false" >> $GITHUB_ENV
            exit 0
          fi
          
          # Add the PPA
          sudo rust-add-apt-repository ppa:git-core/ppa -y
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ FAIL: Add PPA failed with exit code $EXIT_CODE"
            exit 1
          fi
          
          # Verify file was created
          PPA_FILE=$(ls /etc/apt/sources.list.d/git-core-ubuntu-ppa-*.list 2>/dev/null | head -1)
          if [ -z "$PPA_FILE" ]; then
            echo "❌ FAIL: PPA file not created"
            exit 1
          fi
          
          # Verify file contains expected content
          if ! grep -q "git-core/ppa" "$PPA_FILE"; then
            echo "❌ FAIL: PPA file doesn't contain expected repository"
            cat "$PPA_FILE"
            exit 1
          fi
          
          echo "✅ PASS: PPA added successfully"
          echo "File: $PPA_FILE"
          cat "$PPA_FILE"
          echo "PPA_ADDED=true" >> $GITHUB_ENV
          
          # Update package lists
          sudo apt-get update -qq

      # Test 5: Verify repository count increased
      # SUCCESS: Count increased by exactly 1
      - name: Test 5 - Verify count increased
        run: |
          echo "=== Test: Repository count ==="
          
          if [ "$PPA_ADDED" != "true" ]; then
            echo "⏭️ SKIP: PPA was not added, skipping count verification"
            exit 0
          fi
          
          AFTER_COUNT=$(find /etc/apt/sources.list.d/ -name "*.list" -type f | wc -l)
          EXPECTED_COUNT=$((INITIAL_COUNT + 1))
          
          echo "Initial count: $INITIAL_COUNT"
          echo "Current count: $AFTER_COUNT"
          echo "Expected count: $EXPECTED_COUNT"
          
          if [ "$AFTER_COUNT" -eq "$EXPECTED_COUNT" ]; then
            echo "✅ PASS: Count increased by 1 as expected"
          else
            echo "❌ FAIL: Expected $EXPECTED_COUNT files, found $AFTER_COUNT"
            exit 1
          fi

      # Test 6: Verify GPG key was imported
      # SUCCESS: Key file exists in /etc/apt/trusted.gpg.d/
      - name: Test 6 - Verify GPG key imported
        run: |
          echo "=== Test: GPG key import ==="
          
          if [ "$PPA_ADDED" != "true" ]; then
            echo "⏭️ SKIP: PPA was not added, skipping key verification"
            exit 0
          fi
          
          # Check for Git PPA signing key
          KEY_FILE=$(ls /etc/apt/trusted.gpg.d/git-core-ubuntu-ppa-*.gpg 2>/dev/null | head -1)
          
          if [ -z "$KEY_FILE" ]; then
            echo "❌ FAIL: GPG key file not found"
            ls -la /etc/apt/trusted.gpg.d/ || true
            exit 1
          fi
          
          echo "✅ PASS: GPG key imported at $KEY_FILE"

      # Test 7: Verify package from PPA is available
      # SUCCESS: apt-cache policy mentions the PPA
      - name: Test 7 - Verify PPA packages available
        run: |
          echo "=== Test: Package availability ==="
          
          if [ "$PPA_ADDED" != "true" ]; then
            echo "⏭️ SKIP: PPA was not added, skipping package check"
            exit 0
          fi
          
          # Check apt-cache policy for git
          POLICY_OUTPUT=$(apt-cache policy git 2>&1)
          
          if echo "$POLICY_OUTPUT" | grep -q "git-core/ppa"; then
            echo "✅ PASS: Packages from git-core/ppa are available"
          else
            echo "❌ FAIL: git-core/ppa not found in apt-cache policy"
            echo "$POLICY_OUTPUT"
            exit 1
          fi

      # Test 8: Test error handling with invalid PPA
      # SUCCESS: Command fails gracefully with exit code 1
      - name: Test 8 - Error handling
        run: |
          echo "=== Test: Error handling ==="
          
          # This should fail
          sudo rust-add-apt-repository ppa:nonexistent/invalid-ppa-12345 -y 2>&1
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "❌ FAIL: Invalid PPA succeeded (should have failed)"
            exit 1
          fi
          
          # Verify no file was created
          if ls /etc/apt/sources.list.d/nonexistent-ubuntu-invalid-ppa-*.list 2>/dev/null; then
            echo "❌ FAIL: File created for invalid PPA"
            exit 1
          fi
          
          echo "✅ PASS: Invalid PPA failed gracefully (exit $EXIT_CODE)"

      # Cleanup: Remove Git PPA (runs even if tests fail)
      - name: Cleanup - Remove Git PPA
        if: always()
        run: |
          echo "=== Cleanup: Removing Git PPA ==="
          
          # Check if PPA exists
          if ! ls /etc/apt/sources.list.d/git-core-ubuntu-ppa-*.list 2>/dev/null; then
            echo "ℹ️ Git PPA not present, nothing to clean"
            exit 0
          fi
          
          # Remove it
          sudo rust-add-apt-repository --remove ppa:git-core/ppa -y || {
            echo "⚠️ WARNING: Failed to remove PPA via tool, manual cleanup"
            sudo rm -f /etc/apt/sources.list.d/git-core-ubuntu-ppa-*.list
            sudo rm -f /etc/apt/trusted.gpg.d/git-core-ubuntu-ppa-*.gpg
          }
          
          # Verify removal
          if ls /etc/apt/sources.list.d/git-core-ubuntu-ppa-*.list 2>/dev/null; then
            echo "⚠️ WARNING: PPA file still exists after cleanup"
          else
            echo "✅ Cleanup successful"
          fi
          
          sudo apt-get update -qq || true

      # Test 9: Verify cleanup worked
      # SUCCESS: Count equals initial count, no Git PPA files
      - name: Test 9 - Verify cleanup
        run: |
          echo "=== Test: Verify cleanup ==="
          
          FINAL_COUNT=$(find /etc/apt/sources.list.d/ -name "*.list" -type f | wc -l)
          
          echo "Initial count: $INITIAL_COUNT"
          echo "Final count: $FINAL_COUNT"
          
          if [ "$FINAL_COUNT" -ne "$INITIAL_COUNT" ]; then
            echo "⚠️ WARNING: Final count ($FINAL_COUNT) != Initial count ($INITIAL_COUNT)"
            echo "State was not fully restored (may be expected if other tests added repos)"
          else
            echo "✅ PASS: Repository count restored to initial state"
          fi
          
          # Verify Git PPA specifically is gone
          if ls /etc/apt/sources.list.d/git-core-ubuntu-ppa-*.list 2>/dev/null; then
            echo "❌ FAIL: Git PPA file still exists"
            exit 1
          fi
          
          echo "✅ PASS: Git PPA removed successfully"

      # Summary
      - name: Test Summary
        if: always()
        run: |
          echo "========================================="
          echo "        E2E Test Suite Summary"
          echo "========================================="
          echo "Ubuntu: $(lsb_release -ds)"
          echo "Kernel: $(uname -r)"
          echo "Tool: $(rust-add-apt-repository --version)"
          echo ""
          echo "Initial repo count: $INITIAL_COUNT"
          FINAL_COUNT=$(find /etc/apt/sources.list.d/ -name "*.list" -type f | wc -l)
          echo "Final repo count: $FINAL_COUNT"
          echo ""
          if [ "$FINAL_COUNT" -eq "$INITIAL_COUNT" ]; then
            echo "✅ System state restored (idempotent)"
          else
            echo "⚠️ System state changed (non-idempotent)"
          fi
