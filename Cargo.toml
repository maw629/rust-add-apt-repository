[package]
name = "rust-add-apt-repository"
version = "0.1.0"
edition = "2021"
authors = ["rust-add-apt-repository contributors"]
description = "Rust implementation of add-apt-repository command"
license = "GPL-2.0-or-later"
repository = "https://github.com/maw629/rust-add-apt-repository"
readme = "README.md"

[[bin]]
name = "rust-add-apt-repository"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
libc = "0.2"
chrono = "=0.4.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "=3.8.0"
